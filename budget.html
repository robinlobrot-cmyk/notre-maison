<script>
// Moteur de calcul financier : déterministe, sans dépendance, montants en CENTIMES (entiers).
// Convention : montant signé, entrée > 0, sortie < 0.

const enCentimes = (euros) => Math.round(Number(euros) * 100);
const enEuros = (c) => (c / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });

const jour = (iso) => new Date(iso + 'T00:00:00Z');
const iso = (d) => d.toISOString().slice(0, 10);
const ajouterJours = (s, n) => { const d = jour(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const mois = (s) => s.slice(0, 7);

// type : 'revenu' | 'depense' | 'virement_interne' | 'remboursement'
// Totaux d'un mois. Entrées = revenus ; sorties = dépenses - remboursements (net).
// Les virements internes sont exclus (jamais de double comptage).
function totauxMois(txs, m) {
  let revenus = 0, depenses = 0, remboursements = 0, internes = 0;
  for (const t of txs) {
    if (mois(t.date) !== m) continue;
    if (t.type === 'virement_interne') internes += 1;
    else if (t.type === 'remboursement') remboursements += t.amountCents;
    else if (t.type === 'revenu') revenus += t.amountCents;
    else if (t.type === 'depense') depenses += -t.amountCents;
  }
  const entrees = revenus;
  const sorties = depenses - remboursements;
  return { entrees, sorties, excedent: entrees - sorties, remboursements, virementsInternesIgnores: internes };
}

// Répartition par catégorie : chaque transaction compte une seule fois.
function repartition(txs, m) {
  const r = {};
  for (const t of txs) {
    if (mois(t.date) !== m || t.type !== 'depense') continue;
    r[t.category] = (r[t.category] ?? 0) + -t.amountCents;
  }
  return r;
}

// Rapprochement d'UN compte sur une période couverte : somme de TOUS les flux
// (virements internes inclus) = solde de clôture - solde d'ouverture.
function rapprocher({ ouverture, cloture, txs, complet = true }) {
  const flux = txs.reduce((s, t) => s + t.amountCents, 0);
  const variation = cloture - ouverture;
  const ecart = variation - flux;
  const alertes = [];
  if (ecart !== 0) alertes.push(`Écart de rapprochement de ${enEuros(ecart)} : transaction manquante ou solde erroné.`);
  if (!complet) alertes.push('Mois partiellement importé : les totaux ne sont pas ceux du mois complet.');
  return { flux, variation, ecart, ok: ecart === 0 && complet, alertes };
}

const normaliser = (l) => l.toUpperCase().replace(/\s+/g, ' ').trim();
const cle = (t) => `${t.account}|${t.date}|${t.amountCents}|${normaliser(t.label)}`;

// Doublons entre relevés qui se chevauchent. Deux achats identiques le même jour
// dans un même fichier sont conservés ; seule la partie déjà connue est écartée.
function dedoublonner(existantes, entrantes) {
  const connu = new Map();
  for (const t of existantes) connu.set(cle(t), (connu.get(cle(t)) ?? 0) + 1);
  const aImporter = [], doublons = [];
  for (const t of entrantes) {
    const k = cle(t);
    if ((connu.get(k) ?? 0) > 0) { connu.set(k, connu.get(k) - 1); doublons.push(t); }
    else aImporter.push(t);
  }
  return { aImporter, doublons };
}

// Alimentation : budget mensuel moins déjà dépensé, réparti sur les jours restants.
function evenementsAlimentation({ budgetCents, depenseCents, depuis, finMois }) {
  const reste = Math.max(0, budgetCents - depenseCents);
  const jours = Math.round((jour(finMois) - jour(depuis)) / 864e5) + 1;
  const base = Math.floor(reste / jours);
  const ev = [];
  for (let i = 0; i < jours; i++) {
    const montant = i === jours - 1 ? reste - base * (jours - 1) : base;
    if (montant > 0) ev.push({ id: `alim-${i}`, date: ajouterJours(depuis, i), amountCents: -montant, label: 'Alimentation (estimée)', status: 'prevu' });
  }
  return ev;
}

// Prévision jour par jour. Seuls les événements 'prevu' sont appliqués :
// ceux déjà 'paye' sont déjà dans le solde de départ (pas de double déduction).
function prevoir({ soldeDepart, debut, fin, evenements, seuil = 0 }) {
  const jours = [];
  let solde = soldeDepart;
  for (let d = debut; d <= fin; d = ajouterJours(d, 1)) {
    const du = evenements.filter((e) => e.date === d && e.status === 'prevu');
    solde += du.reduce((s, e) => s + e.amountCents, 0);
    jours.push({ date: d, solde, evenements: du });
  }
  const bas = jours.reduce((m, j) => (j.solde < m.solde ? j : m), jours[0]);
  return {
    jours, soldeFin: solde, pointBas: bas.solde, datePointBas: bas.date,
    joursSousSeuil: jours.filter((j) => j.solde < seuil).map((j) => j.date),
    manquePourSeuil: Math.max(0, seuil - bas.solde),
  };
}

// Simulation : ne modifie jamais les données d'entrée (copie).
function simulerAchat(entree, achat) {
  const evenements = [...entree.evenements, ...achat.echeances.map((e, i) => ({
    id: `sim-${i}`, date: e.date, amountCents: -Math.abs(e.amountCents), label: achat.nom, status: 'prevu' }))];
  const avant = prevoir(entree);
  const apres = prevoir({ ...entree, evenements });
  const marge = apres.pointBas - (entree.seuil ?? 0);
  const proches = entree.evenements.filter((e) => e.status === 'prevu' && achat.echeances.some(
    (x) => Math.abs((jour(e.date) - jour(x.date)) / 864e5) <= 7));
  return {
    soldeFinAvant: avant.soldeFin, soldeFinApres: apres.soldeFin,
    pointBasAvant: avant.pointBas, pointBasApres: apres.pointBas, datePointBas: apres.datePointBas,
    marge, risque: marge < 0 ? 'rouge' : marge < (entree.seuil ?? 0) * (entree.margeFaible ?? 0.25) ? 'orange' : 'vert',
    depensesProches: proches, joursSousSeuil: apres.joursSousSeuil,
    joursAvant: avant.jours, joursApres: apres.jours,
  };
}

function comparerDates(entree, nom, montantCents, dates, echeancesDe = (date) => [{ date, amountCents: montantCents }]) {
  const options = dates.map((date) => ({ date, ...simulerAchat(entree, { nom, echeances: echeancesDe(date) }) }));
  const viables = options.filter((o) => o.marge >= 0).sort((a, b) => b.pointBasApres - a.pointBasApres || a.date.localeCompare(b.date));
  return { options, meilleure: viables[0]?.date ?? null };
}

// Lecture du texte d'un relevé PDF Caisse d'Epargne (texte déjà extrait du PDF, mise en page conservée).
// Ne décide rien en silence : produit des SUGGESTIONS marquées "a_valider" et des CONTRÔLES chiffrés.


const MONTANT = '([+-])\\s*(\\d[\\d\\s\\u00a0\\u202f]*,\\d{2})';
const LIGNE = new RegExp(`^\\s*(\\d{2}/\\d{2}/\\d{4})\\s+(\\d{2}/\\d{2}/\\d{4})\\s+(.*?)\\s+${MONTANT}\\s*$`);
const SOLDE = new RegExp(`SOLDE\\s+(?:CREDITEUR|DEBITEUR)\\s+AU\\s+(\\d{2}/\\d{2}/\\d{4})\\s+${MONTANT}`, 'i');

const aCentimes = (signe, txt) => (signe === '-' ? -1 : 1) * parseInt(txt.replace(/[\s\u00a0\u202f]/g, '').replace(',', ''), 10);
const aIso = (d) => `${d.slice(6)}-${d.slice(3, 5)}-${d.slice(0, 2)}`;

// "FACT 300326" = date réelle de l'achat (jjmmaa) ; la ligne est datée du jour du prélèvement différé.
function dateAchat(libelle) {
  const m = libelle.match(/FACT\s+(\d{2})(\d{2})(\d{2})/);
  return m ? `20${m[3]}-${m[2]}-${m[1]}` : null;
}

// Mots-clés courants des libellés bancaires français → catégorie proposée (toujours à valider par vous ; vos propres règles passent avant)
const MOTS = [
  [/VIREMENT INTERNE|MAELYS LAI/, { type: 'virement_interne' }],
  [/REMB(OURSEMENT)?\b/, { type: 'remboursement', categorie: 'Remboursements reçus' }],
  [/SALAIRE|PAIE\s/, { type: 'revenu', categorie: 'Salaire' }],
  [/\bMSA\b|\bCAF\b|CPAM|FRANCE TRAVAIL|POLE EMPLOI|PREST\.?\s?FAM/, { type: 'revenu', categorie: 'Prestations et aides' }],
  [/\bEDF\b|ENGIE|TOTALENERGIES|FREE\b|ORANGE|SFR|BOUYGUES|SOSH|MACIF|MATMUT|AXA|MAIF|MMA|GROUPAMA|ASSURANC|MUTUELLE|DIRECTION GENERALE DES FIN|IMPOT|DGFIP|KEREIS|CRECHE|EAU\b|VEOLIA|SUEZ|LOYER|NETFLIX|SPOTIFY|DISNEY|CANAL\+?|APPLE\.COM\/BILL|OPENAI|CHATGPT|AMAZON PRIME|PLAYSTATION|DEEZER|YOUTUBE|ICLOUD|GOOGLE ONE/, { type: 'depense', categorie: 'Charges fixes', recurrent: 'a_confirmer' }],
  [/SODICHAMP|SODEXO|INTERMARCHE|LECLERC|CARREFOUR|AUCHAN|LIDL|ALDI|MONOPRIX|CASINO|SUPER U|SYSTEME U|PICARD|GRAND FRAIS|BOULANG|BOUCHER|DRIVE|MCDONALD|KFC|BURGER|PIZZ|RESTAU|CAFE|BRASSERIE|UBER\s?EATS|DELIVEROO/, { type: 'depense', categorie: 'Alimentation' }],
  [/PHARMACIE|\bDR\s|MEDECIN|DENTIST|OPTIC|KINE|LABORATOIRE|AMAZON|VINTED|LEETCHI|PAYPAL|OUIRACE|IKEA|DECATHLON|FNAC|CULTURA|ZARA|KIABI|ACTION\b|BEBE|BOUTIK|STATION|CARBURANT|ESSO|SHELL|TOTAL\b|PARC AUTO|AUTOROUTE|PEAGE|SNCF|UBER|RELAY|TABAC|PRESSE|PHOTOBOX|SPORT|CLUB/, { type: 'depense', categorie: 'Autres dépenses variables' }],
];
function suggerer(t) {
  const L = t.libelle.toUpperCase();
  if (t.section === 'PAIEMENTS DIFFERES' && t.cents > 0) return { type: 'remboursement', confiance: 'moyenne' };
  if (t.section === 'FRAIS BANCAIRES') return { type: t.cents > 0 ? 'remboursement' : 'depense', categorie: 'Charges fixes', confiance: 'haute' };
  if (t.section === 'OPERATION DE DEPOT') return { type: 'revenu', categorie: 'Opérations à valider', confiance: 'faible' };
  if (/VIR(EMENT)?\s.*(VERS|EPARGNE)/.test(L) || /VIREMENT VERS/.test(L)) return { type: 'virement_interne', confiance: 'faible' };
  if (/^ECH PRET|^PRLV/.test(L)) return { type: 'depense', categorie: 'Charges fixes', recurrent: 'a_confirmer', confiance: 'moyenne' };
  if (/INTERESSEMENT|PARTICIPATION/.test(L)) return { type: 'revenu', categorie: 'Autres revenus', recurrent: 'non', confiance: 'moyenne' };
  for (const [re, s] of MOTS) if (re.test(L) && (s.type !== 'depense' || t.cents < 0) && (s.type !== 'revenu' || t.cents > 0)) return { ...s, confiance: 'moyenne' };
  if (t.cents > 0 && /^CB\s/.test(L)) return { type: 'remboursement', confiance: 'faible' }; // retour d'un achat par carte
  if (t.cents > 0) return { type: 'revenu', confiance: 'faible' };
  if (/^CB\s/.test(L)) return { type: 'depense', categorie: 'Autres dépenses variables', confiance: 'faible' };
  return { type: 'depense', confiance: 'faible' };
}

function lireReleve(texte, { compte = 'principal' } = {}) {
  const lignes = texte.split(/\r?\n/);
  // « SOLDE CREDITEUR/DEBITEUR AU jj/mm/aaaa ± montant » : tolérant sur les accents, le signe manquant et un montant tombé sur la ligne suivante (lecture de PDF)
  const soldes = [];
  lignes.forEach((l, i) => {
    const e = l.match(/SOLDE\s+(CR[ÉE]DITEUR|D[ÉE]BITEUR)\s+AU\s+(\d{2}\/\d{2}\/\d{4})(.*)$/i); if (!e) return;
    const suite = [e[3], lignes[i + 1] || '', lignes[i + 2] || ''];
    for (const s of suite) {
      const a = s.match(/([+-])?\s*(\d[\d\s\u00a0\u202f]*,\d{2})/); if (!a) continue;
      soldes.push([l, e[2], a[1] || (/^D/i.test(e[1]) ? '-' : '+'), a[2]]); return;
    }
  });
  const ouverture = soldes.length ? aCentimes(soldes[0][2], soldes[0][3]) : null;
  const cloture = soldes.length > 1 ? aCentimes(soldes.at(-1)[2], soldes.at(-1)[3]) : null;

  const transactions = [], controles = [], attendus = { frais: null, cartes: [] };
  let section = null, carte = null, dernier = null;
  const SECTIONS = ['OPERATION DE DEPOT', 'VIREMENTS RECUS', 'FRAIS BANCAIRES', 'PAIEMENTS DIFFERES', 'RETRAITS', 'PRELEVEMENTS'];

  for (const l of lignes) {
    const s = l.trim();
    const h = SECTIONS.find((x) => s.startsWith(x));
    if (h) {
      section = h; carte = null; dernier = null;
      const f = s.match(/TOTAL DE\s+-\s*([\d\s,]+)\s*€/);
      if (f) attendus.frais = aCentimes('-', f[1]);
      const c = s.match(/carte bancaire N°\s*(\d{4})/i);
      if (c && h !== 'RETRAITS') { carte = { fin: c[1], attendu: null, somme: 0 }; attendus.cartes.push(carte); } // les retraits sont débités tout de suite : pas de total « prélevé » à contrôler
      continue;
    }
    const pre = s.match(/montant pr[ée]lev[ée].*?:\s*([\d\s\u00a0\u202f]+,\d{2})\s*€/i);
    if (pre && carte) { carte.attendu = aCentimes('-', pre[1]); continue; }
    const m = l.match(LIGNE);
    if (m) {
      const t = { id: `${compte}-${transactions.length}`, account: compte, date: aIso(m[1]), dateValeur: aIso(m[2]),
        label: m[3].trim(), libelle: m[3].trim(), amountCents: aCentimes(m[4], m[5]), cents: aCentimes(m[4], m[5]),
        section, carte: carte?.fin ?? null, dateAchat: dateAchat(m[3]), detail: [] };
      if (carte) carte.somme += t.amountCents;
      Object.assign(t, { suggestion: suggerer(t), statut: 'a_valider' });
      delete t.cents; delete t.libelle;
      transactions.push(t); dernier = t;
    } else if (dernier && s.startsWith('-Réf') === false && s && !SOLDE.test(s) && /^\S/.test(s) && l.startsWith(' ') && !/^DATE|^D'OPERATION|^VALEUR|^MONTANT|^EN EUR/.test(s)) {
      dernier.detail.push(s); // lignes de complément du libellé
    }
  }

  const rap = ouverture !== null && cloture !== null ? rapprocher({ ouverture, cloture, txs: transactions }) : null;
  if (!rap) controles.push({ ok: false, message: 'Soldes d\'ouverture/clôture introuvables : rapprochement impossible.' });
  else controles.push({ ok: rap.ok, message: rap.ok ? 'Rapprochement avec les soldes du relevé : écart nul.' : rap.alertes.join(' ') });

  if (attendus.frais !== null) {
    const somme = transactions.filter((t) => t.section === 'FRAIS BANCAIRES').reduce((a, t) => a + t.amountCents, 0);
    // Le relevé annonce le total des frais hors remboursement éventuel : on signale l'écart sans le corriger.
    controles.push({ ok: somme === attendus.frais, message: `Frais bancaires : relevé ${-attendus.frais / 100} €, lignes ${-somme / 100} €.` });
  }
  for (const c of attendus.cartes) {
    controles.push({ ok: c.attendu !== null && c.attendu === c.somme,
      message: `Carte ${c.fin} : prélèvement annoncé ${c.attendu === null ? '?' : -c.attendu / 100} €, somme des lignes ${-c.somme / 100} €.` });
  }
  const dateOuverture = soldes.length ? aIso(soldes[0][1]) : null;
  const dateCloture = soldes.length > 1 ? aIso(soldes.at(-1)[1]) : null;
  return { ouverture, cloture, dateOuverture, dateCloture, transactions, controles, ok: controles.every((c) => c.ok) };
}

/* ---------- synchronisation entre appareils (par fichier, sans serveur) ----------
   Principe : chaque enregistrement garde, dans S.sync, une empreinte et une date de dernière modification (tenues à jour
   automatiquement à chaque enregistrement) ; les suppressions sont mémorisées. Deux appareils échangent un fichier
   (identique à une sauvegarde) et fusionnent enregistrement par enregistrement : la modification la plus récente l'emporte,
   la version écartée est gardée dans un journal. Pour ajouter un type de données à synchroniser : l'ajouter à COLL. */
var COLL=[
 {k:'txs',lab:'Opérations',id:x=>x.id,nat:x=>[x.account,x.date,x.amountCents,String(x.label).toUpperCase().replace(/\s+/g,' ').trim()].join('|'),nom:x=>`${fd0(x.date)} · ${x.label} · ${enEuros(x.amountCents)}`},
 {k:'releves',lab:'Relevés',id:x=>x.id,nat:x=>[x.compte,x.debut,x.fin].join('|'),nom:x=>`Relevé ${x.compte} du ${fd0(x.debut)} au ${fd0(x.fin)}`},
 {k:'recurrences',lab:'Revenus et dépenses prévus',id:x=>x.id,nat:x=>[String(x.nom).toLowerCase().trim(),x.montantCents,x.sens,x.frequence,x.prochaine].join('|'),nom:x=>`${x.nom} (${enEuros(x.montantCents)})`},
 {k:'projets',lab:'Projets et simulations',id:x=>x.id,nat:x=>[String(x.nom).toLowerCase().trim(),x.montantCents,x.date,x.statut,x.paiements||1].join('|'),nom:x=>`${x.nom} (${enEuros(x.montantCents)})`},
 {k:'regles',lab:'Règles de classement',id:x=>x.cle,nat:x=>x.cle,nom:x=>`Règle « ${x.cle} »`}];
const SYNOK=S=>S&&S.sync&&S.sync.v===1;
const stab=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const hach=o=>{const t=stab(o)||'';let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
 a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const syncParams=X=>{const o={};for(const[k,v]of Object.entries(X.params||{}))o['prm:'+k]=v;for(const k of['seuil','budgetAlim'])if(Number.isFinite(X[k]))o['prm:'+k]=X[k];return o};
const syncPoser=(k,v)=>{k=k.slice(4);if(k==='seuil'||k==='budgetAlim')S[k]=v;else S.params[k]=v};
function syncSuivre(){if(!S||S.mode==='demo')return;const prem=!SYNOK(S);
 if(prem)S.sync={v:1,appareil:'A'+Math.random().toString(36).slice(2,7).toUpperCase(),e:{},suppr:{},dernier:0,conflits:[]};
 const Z=S.sync,now=Date.now(),vus=new Set();let n=0;
 const marque=(k,v)=>{const h=hach(v),e=Z.e[k];if(!e||e[0]!==h){Z.e[k]=[h,prem?0:now];delete Z.suppr[k]}};
 for(const c of COLL)for(const x of S[c.k]){if(x.id===undefined&&c.k!=='regles')x.id='s'+now.toString(36)+(n++);const k=c.k+':'+c.id(x);vus.add(k);marque(k,x)}
 for(const k in Z.e)if(!k.startsWith('prm:')&&!vus.has(k)){Z.suppr[k]=now;delete Z.e[k]}
 for(const[k,v]of Object.entries(syncParams(S)))marque(k,v)}
const syncT=(Z,k)=>(Z.e[k]||[0,0])[1];
function syncPlan(R){syncSuivre();const L=S.sync,RS=SYNOK(R)?R.sync:{e:{},suppr:{}},base=L.dernier||0,P={ajout:[],modif:[],suppr:[],prm:[],conflits:[],tombs:{},ident:0};
 for(const c of COLL){const lm=new Map(S[c.k].map(x=>[String(c.id(x)),x])),rm=new Map((R[c.k]||[]).map(x=>[String(c.id(x)),x])),lo=[],ro=[];
  for(const[id,x]of lm){const k=c.k+':'+id,y=rm.get(id);
   if(y===undefined){const rt=RS.suppr[k];if(rt&&rt>syncT(L,k))P.suppr.push({c,id,k,x,t:rt});else lo.push(x)}
   else if(hach(x)===hach(y))P.ident++;
   else{const lt=syncT(L,k),rt=syncT(RS,k),conf=lt>base&&rt>base;
    if(rt>lt){P.modif.push({c,id,k,x:y,t:rt});if(conf)P.conflits.push({c,id,k,gagne:'distante',perdant:x})}

 if(S.mode==='demo')return 0;
 const now=new Date().toISOString(),dn=x=>Date.parse(x+'T00:00:00Z');let n=0;
 const cands=S.txs.filter(t=>t.origine&&t.origine.app==='quotidien'&&!t.origine.banque&&!t.origine.supprime&&/^quotidien:achat:/.test(t.origine.ref||'')&&t.account==='Notre quotidien'&&t.amountCents<0).sort((x,y)=>x.date<y.date?-1:1);
 if(!cands.length)return 0;
 const pris=new Set();
 for(const c of cands){let best=null,bd=99;
  for(const bk of S.txs){if(bk===c||bk.origine||pris.has(bk)||bk.account==='Notre quotidien'||bk.source!=='import'||bk.amountCents!==c.amountCents)continue;
   const dd=Math.abs(dn(bk.date)-dn(c.date))/864e5;if(dd<=4&&dd<bd){best=bk;bd=dd}}
  if(!best)continue;pris.add(best);
  best.origine={app:'quotidien',ref:c.origine.ref,rev:c.origine.rev,banque:true};if(c.payeur)best.payeur=c.payeur;if(c.note&&!best.note)best.note=c.note;
  if(aVerifier(best)){best.type='depense';best.category=c.category||'Alimentation';best.statut='valide'}
  S.txs.splice(S.txs.indexOf(c),1);
  A.accuses[c.origine.ref]={rev:c.origine.rev,le:now,etat:'rapproche',id:best.id};n++}
 return n}
function rapprocherAuto(){try{if(S.mode==='demo')return 0;const A=echLire(ACC_K)||{v:1,accuses:{}};if(!A.accuses||typeof A.accuses!=='object')A.accuses={};
 const n=rapprocherCourses(A);if(n){JSRC='rapprochement';if(svEcrire()){try{localStorage.setItem(ACC_K,JSON.stringify(A))}catch(e){}}toast(n+' dépense(s) de courses rapprochée(s) avec le relevé')}return n}catch(e){return 0}}
function integrerEchanges(manuel){
 if(S.mode==='demo')return{cre:0,maj:0,rat:0,demo:true};
 const E=echLire(ECH_K),q=echLire('quotidien.v1'),A=echLire(ACC_K)||{v:1,accuses:{}},now=new Date().toISOString();
 if(!A.accuses||typeof A.accuses!=='object')A.accuses={};
 let cre=0,maj=0,rat=0,ch=false;const iso=x=>/^\d{4}-\d\d-\d\d$/.test(x||'');
 /* 1. rattachement des anciennes dépenses et projets déjà envoyés par fichier (une seule fois chacun) */
 if(q&&Array.isArray(q.achats)){const libres=S.txs.filter(t=>!t.origine&&t.account==='Notre quotidien'),pris=new Set();
  for(const a of q.achats){if(!(a.montantCents>0)||!(a.fichierLe||a.confirmeLe))continue;const ref='quotidien:achat:'+a.id;
   if(A.accuses[ref]||S.txs.some(x=>x.origine&&x.origine.ref===ref))continue;
   const lab='Courses'+(a.magasin?' '+a.magasin:'')+' (Notre quotidien)',t=libres.find(x=>!pris.has(x)&&x.date===a.date&&x.amountCents===-a.montantCents&&x.label===lab);if(!t)continue;
   pris.add(t);t.origine={app:'quotidien',ref,rev:'legacy'};t.payeur={idx:String(a.payePar),nom:payeurNom(String(a.payePar),q.personnes)};A.accuses[ref]={rev:'legacy',le:now,etat:'rattache',id:t.id};rat++;ch=true}}
 if(q&&Array.isArray(q.taches))for(const p of S.projets){if(p.origine||typeof p.id!=='string'||!p.id.startsWith('nq-t-'))continue;const tid=p.id.slice(5);
  if(!q.taches.some(t=>t.id===tid))continue;const ref='quotidien:tache:'+tid;p.origine={app:'quotidien',ref,rev:'legacy',statutSource:p.statut};A.accuses[ref]={rev:'legacy',le:now,etat:'rattache',id:p.id};rat++;ch=true}
 /* 2. éléments déposés par Mon Quotidien */
 if(E&&E.entrees&&typeof E.entrees==='object')for(const[ref,e]of Object.entries(E.entrees)){
  if(!e||typeof e!=='object'||!e.donnees||typeof e.donnees!=='object')continue;const a=A.accuses[ref];if(a&&a.rev===e.rev)continue;const d=e.donnees;
  if(e.type==='depense'){
   let t=S.txs.find(x=>x.origine&&x.origine.ref===ref)||S.txs.find(x=>x.id===ref);
   if(d.supprime){if(t&&!(t.origine&&t.origine.supprime)){t.origine=Object.assign({},t.origine,{supprime:true});maj++}
    A.accuses[ref]={rev:e.rev,le:now,etat:a&&a.etat==='rapproche'?'rapproche':'recu'};ch=true;continue}
   if(!iso(d.date)||!(d.montantCents>0))continue;
   const label='Courses'+(d.magasin?' '+d.magasin:''),note=(Array.isArray(d.articles)?d.articles.join(', '):'').slice(0,300),py=d.payeur&&d.payeur.idx!==undefined?{idx:String(d.payeur.idx),nom:String(d.payeur.nom||'')}:null,mt=-Math.round(d.montantCents);
   if(!t){const m=S.txs.find(x=>!x.origine&&x.account==='Notre quotidien'&&x.date===d.date&&x.amountCents===mt);
    if(m){m.origine={app:'quotidien',ref,rev:e.rev};if(py)m.payeur=py;if(!m.note)m.note=note;rat++}
    else{S.txs.push({id:ref,date:d.date,amountCents:mt,type:'depense',category:d.categorie||'Alimentation',label,account:'Notre quotidien',statut:'valide',source:'quotidien',note,payeur:py,origine:{app:'quotidien',ref,rev:e.rev}});cre++}}
   else if(t.origine&&t.origine.banque){if(py)t.payeur=py;if(!t.note)t.note=note;const o=Object.assign({},t.origine,{rev:e.rev});delete o.supprime;t.origine=o;maj++}
   else{t.date=d.date;t.amountCents=mt;t.label=label;t.note=note;if(py)t.payeur=py;t.origine={app:'quotidien',ref,rev:e.rev};maj++}}
  else if(e.type==='projet'){
   let p=S.projets.find(x=>x.origine&&x.origine.ref===ref)||S.projets.find(x=>x.id===ref);
   if(d.supprime){if(p&&!(p.origine&&p.origine.supprime)){p.origine=Object.assign({},p.origine,{supprime:true});maj++}
    A.accuses[ref]={rev:e.rev,le:now,etat:'recu'};ch=true;continue}
   if(!d.nom||!(d.montantCents>0)||!iso(d.date))continue;
   if(!p){const m=S.projets.find(x=>!x.origine&&x.nom===d.nom&&x.date===d.date&&x.montantCents===Math.round(d.montantCents));if(m){m.origine={app:'quotidien',ref,rev:e.rev,statutSource:d.statut in STATUTS?d.statut:'a_planifier'};p=null;rat++;A.accuses[ref]={rev:e.rev,le:now,etat:'rattache',id:m.id};ch=true;continue}}
   const pa=Math.max(1,parseInt(d.paiements)||1),st=d.statut in STATUTS?d.statut:'a_planifier';
   if(!p){S.projets.push({id:ref,nom:d.nom,montantCents:Math.round(d.montantCents),date:d.date,paiements:pa,statut:st,indispensable:!!d.indispensable,origine:{app:'quotidien',ref,rev:e.rev,statutSource:st}});cre++}
   else{p.nom=d.nom;p.montantCents=Math.round(d.montantCents);p.date=d.date;p.paiements=pa;if(!p.origine||p.origine.statutSource!==st)p.statut=st;p.origine={app:'quotidien',ref,rev:e.rev,statutSource:st};maj++}}
  else continue;
  {const tt=S.txs.find(x=>x.origine&&x.origine.ref===ref);A.accuses[ref]={rev:e.rev,le:now,etat:tt&&tt.origine.banque?'rapproche':'recu'};ch=true}}
 const rap=rapprocherCourses(A);if(rap)ch=true;
 if(ch){JSRC='échange';if(svEcrire()){try{localStorage.setItem(ACC_K,JSON.stringify(A))}catch(e){}}
  if(!manuel&&(cre||maj)){toast(`${cre+maj} élément(s) reçu(s) de Mon Quotidien`);if(!document.getElementById('modal').innerHTML&&!/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||''))rendu()}}
 return{cre,maj,rat,rap}}
function echangesCorps(){const E=echLire(ECH_K),A=echLire(ACC_K),nt=S.txs.filter(t=>t.origine&&t.origine.app==='quotidien').length,np=S.projets.filter(p=>p.origine&&p.origine.app==='quotidien').length,nb=S.txs.filter(t=>t.origine&&t.origine.banque).length,ns=S.txs.filter(t=>t.origine&&t.origine.supprime).length,
 att=E&&E.entrees?Object.entries(E.entrees).filter(([r,e])=>!(A&&A.accuses&&A.accuses[r]&&A.accuses[r].rev===e.rev)).length:0;
 return`<div class="pr"><div class="pr-t"><b>Échanges avec Mon Quotidien</b><p class="k">Les dépenses de courses et les projets venant de Mon Quotidien arrivent ici automatiquement, une seule fois, avec une référence à leur origine. Si l'un d'eux est modifié là-bas, la ligne correspondante est mise à jour ici, sans doublon. La catégorie et le statut choisis ici ne sont pas modifiés. Les dépenses arrivent déjà validées, avec le nom du payeur. Si une dépense de courses correspond à une ligne de relevé bancaire (même montant, date à 4 jours près au plus), les deux sont fusionnées automatiquement : la ligne bancaire est conservée. Une session supprimée dans Mon Quotidien est seulement signalée ici, jamais effacée.</p></div>
 <div class="pr-c"><div class="k"><b>${nt}</b> dépense(s) et <b>${np}</b> projet(s) reliés à Mon Quotidien · <b>${nb}</b> fusionnée(s) avec une ligne bancaire${ns?` · <b>${ns}</b> supprimée(s) dans Mon Quotidien`:''} · <b>${att}</b> en attente${S.mode==='demo'?' (les échanges attendent que vous quittiez les données de démonstration)':''}</div>
 <p style="margin:10px 0 0"><button class="a" onclick="echangesVerif()">Vérifier maintenant</button></p></div></div>`}
function echangesVerif(){const r=integrerEchanges(true);toast(r.demo?'Échanges en attente : vous utilisez les données de démonstration':(r.cre||r.maj||r.rat||r.rap)?`${r.cre} créé(s), ${r.maj} mis à jour, ${r.rat} ancien(s) rattaché(s), ${r.rap||0} rapproché(s) avec la banque`:'Rien de nouveau à recevoir');rendu()}
addEventListener('storage',e=>{if(e.key===ECH_K)integrerEchanges()});addEventListener('focus',()=>{integrerEchanges()});

addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(ONGLETS[h]&&h!==onglet)aller(h);else hashSimTache()});
/* ouverture depuis une tâche de Mon Quotidien : on affiche le simulateur sur le projet relié, avec les 4 dates comparées */
function hashSimTache(){const m=(location.hash||'').match(/^#simtache=([^&]+)/);if(!m)return;const ref='quotidien:tache:'+decodeURIComponent(m[1]);
 try{history.replaceState(null,'','#sim')}catch(e){}
 try{integrerEchanges(true)}catch(e){}
 const p=S.projets.find(x=>x.origine&&x.origine.ref===ref);
 if(!p){toast(S.mode==='demo'?'Quittez les données de démonstration pour recevoir les projets de Mon Quotidien.':'Projet pas encore reçu de Mon Quotidien : réessayez dans un instant.');aller('proj');return}
 if(p.statut!=='a_planifier'&&!confirm('Ce projet est déjà « '+STATUTS[p.statut].toLowerCase()+' » et compté dans la prévision. Le simuler le compterait deux fois. Continuer quand même ?'))return aller('proj');
 testerProj(p.id);try{lancer()}catch(e){}}
try{syncSuivre();journalSuivre();navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{integrerEchanges(true)}catch(e){}

/* ---------- visite guidée (nouvel utilisateur) ---------- */
const VISITE=[
 ['bord','Votre tableau de bord','Votre situation d\'un coup d\'œil : ce que vous pouvez encore dépenser ce mois-ci, le solde prévu et les alertes à traiter en priorité.'],
 ['imp','1. Importez vos relevés','C\'est le point de départ : importez le fichier de votre banque (CSV ou Excel). Les opérations sont classées automatiquement, vous corrigez ce qui doit l\'être.'],
 ['tx','2. Vérifiez vos opérations','Rien n\'est classé sans votre accord. L\'application retient vos choix pour classer seule les prochaines opérations du même commerçant.'],
 ['dep','3. Déclarez vos charges et revenus','Salaire, loyer, abonnements… Ces échéances régulières servent de base à toutes les prévisions.'],
 ['prev','4. Anticipez les mois à venir','L\'évolution prévue de votre compte, mois par mois, selon trois scénarios. Le calendrier détaille ensuite jour par jour.'],
 ['sim','5. Testez un achat avant de le faire','Le simulateur indique si vous pouvez acheter maintenant, ou la meilleure date pour le faire sans passer sous votre seuil de sécurité.'],
 ['alertes','6. Laissez l\'application vous prévenir','Solde faible, risque de découvert, charge à venir, budget dépassé… Les alertes expliquent et proposent une action.'],
 ['param','7. Réglez à votre façon','Seuil de sécurité, alertes, catégories, valeurs par défaut. C\'est aussi ici que se trouvent la sauvegarde et la synchronisation entre appareils.'],
 ['bord','À vous de jouer','']];
let VIS=-1;
const visiteVue=()=>{try{return localStorage.getItem('budget.visite')==='1'}catch(e){return false}},visiteNote=()=>{try{localStorage.setItem('budget.visite','1')}catch(e){}};
function visiteDebut(){fermer();visiteNote();if(window.Maison&&Maison.visite)Maison.visite.demarrer()}
function visiteAff(){const st=VISITE[VIS],der=VIS===VISITE.length-1,dem=S.mode==='demo';if(st[0]!==onglet)aller(st[0]);
 let c=document.getElementById('visite');if(!c){c=document.createElement('div');c.id='visite';c.setAttribute('role','dialog');c.setAttribute('aria-label','Visite guidée');document.body.appendChild(c)}
 const txt=der?(dem?'Vous explorez des données fictives. Quand vous êtes prêt, importez votre premier relevé : les données de démonstration seront alors remplacées (après confirmation).':'Vous connaissez l\'essentiel. Vous pouvez relancer cette visite à tout moment depuis « Paramétrage ».'):st[2];
 c.innerHTML=`<div class="vh2"><b>${st[1]}</b><button class="ib" onclick="visiteFin()" aria-label="Quitter la visite">${ic('close')}</button></div><p>${txt}</p>
 <div class="vp" aria-hidden="true">${VISITE.map((x,i)=>`<i class="${i===VIS?'on':''}"></i>`).join('')}</div>
 <div class="vb">${VIS>0?`<button class="a g" onclick="visitePas(-1)">Précédent</button>`:''}${der?(dem?`<button class="a" id="vf" onclick="visiteCommencer()">Commencer avec mes données</button><button class="a g" onclick="visiteFin()">Rester en démo</button>`:`<button class="a" id="vf" onclick="visiteFin()">Terminer</button>`):`<button class="a" id="vf" onclick="visitePas(1)">Suivant</button><button class="a g" onclick="visiteFin()">Passer</button>`}</div>
 <div class="k" style="margin-top:6px">Étape ${VIS+1} sur ${VISITE.length}</div>`;
 const f=document.getElementById('vf');if(f)f.focus({preventScroll:true})}
function visitePas(n){VIS=Math.max(0,Math.min(VISITE.length-1,VIS+n));visiteAff()}
function visiteFin(){VIS=-1;const c=document.getElementById('visite');if(c)c.remove();document.body.classList.remove('visite')}
function visiteCommencer(){visiteFin();aller('imp')}
function visiteAuto(){if(S.mode!=='demo'||visiteVue()||(window.Maison&&Maison.visite&&Maison.visite.active())||document.getElementById('modal').innerHTML)return;visiteNote();
 modal('Bienvenue dans Mon budget',`<p>Cette application vous aide à <b>anticiper vos fins de mois</b> : elle lit vos relevés bancaires, prévoit l'évolution de votre compte et vous dit si un achat est raisonnable.</p>
 <ul style="margin:8px 0 8px 18px;padding:0"><li>Vos données restent <b>sur votre appareil</b> : aucun compte, aucun envoi.</li><li>Pour l'instant, vous voyez des <b>données fictives</b> pour explorer sans risque.</li></ul>
 <p><button class="a" onclick="visiteDebut()">Faire la visite (3 minutes)</button> <button class="a g" onclick="fermer()">Explorer seul</button></p>
 <p class="k">Vous pourrez relancer la visite depuis le bandeau jaune ou « Paramétrage ».</p>`)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&VIS>=0)visiteFin()});
setTimeout(visiteAuto,500);

rendu();
try{hashSimTache()}catch(e){}
