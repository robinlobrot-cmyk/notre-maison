<!DOCTYPE html>
<html lang="fr" data-espace="quotidien">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#62011d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mon Quotidien — tâches et courses · Notre Maison</title>
<style>
/* ===== Thème : mêmes couleurs que « Mon budget » ===== */
:root{--bord-c:#9a7f78;--btn:#1f6b82;--btn-h:#185669;--bg:#fbf3e8;--surface:#fffdf9;--surface2:#f6ead9;--bord:#e8d8c3;--txt:#2b0a14;--muted:#6b4a52;--acc:#9b1b3c;--acc2:#e8737a;--acc-soft:#fbe3e1;--ok:#047857;--ok-soft:#e6f7ef;--warn:#b45309;--warn-soft:#fff3df;--ko:#c92a1f;--ko-soft:#fde8e4;--sh:0 1px 2px rgba(43,10,20,.05),0 6px 20px rgba(43,10,20,.05);--bgbase:linear-gradient(160deg,#fcf4ea 0%,#fdebe3 50%,#fbe6e6 100%);--ia:.55}
@media(prefers-color-scheme:dark){:root{--bord-c:#a77b7f;--btn:#2b7f98;--btn-h:#34899f;--bg:#1a0409;--surface:#260811;--surface2:#320d19;--bord:#4a1a28;--txt:#f8ead8;--muted:#c4a39b;--acc:#f08a8f;--acc2:#ffb39a;--acc-soft:#3d1220;--ok:#34d399;--ok-soft:#0e2a21;--warn:#fbbf24;--warn-soft:#2b2210;--ko:#ff6b5e;--ko-soft:#3a1214;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--bgbase:linear-gradient(160deg,#1d050b 0%,#150308 50%,#240710 100%);--ia:.4}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;font:14.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* fond animé (version légère de celui du budget) */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bgbase)}
.bg i{position:absolute;border-radius:50%;opacity:var(--ia);filter:blur(10px);will-change:transform}
.o1{width:60vmax;height:60vmax;left:-15vmax;top:-20vmax;background:radial-gradient(closest-side,rgba(232,115,122,.7),transparent);animation:fl1 38s ease-in-out infinite}
.o2{width:55vmax;height:55vmax;right:-15vmax;top:10vh;background:radial-gradient(closest-side,rgba(255,190,150,.7),transparent);animation:fl2 46s ease-in-out infinite}
.o3{width:50vmax;height:50vmax;left:20vw;bottom:-25vmax;background:radial-gradient(closest-side,rgba(246,223,191,.7),transparent);animation:fl1 54s ease-in-out infinite reverse}
@keyframes fl1{50%{transform:translate(8vmax,6vmax) scale(1.1)}}@keyframes fl2{50%{transform:translate(-7vmax,8vmax) scale(.92)}}
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}

/* mise en page */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--bord);background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;padding:4px 8px 18px}
.logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;color:#fff;background:linear-gradient(135deg,#9b1b3c,#d65a63);box-shadow:0 6px 16px rgba(214,69,93,.35)}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;cursor:pointer;font-weight:550;text-align:left;color:var(--txt)}
.it:hover{background:var(--surface2)}.it.on{background:linear-gradient(90deg,var(--acc-soft),transparent);box-shadow:inset 3px 0 0 var(--acc);color:var(--acc)}
.it svg,.tb svg{width:20px;height:20px;flex:none}
.pill{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;min-width:20px;padding:1px 7px;border-radius:99px;background:var(--acc);color:#fff;text-align:center}
main{padding:28px 32px 90px;max-width:1080px;width:100%;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}.ph h1{margin:0;font-size:26px;letter-spacing:-.02em}.ph p{margin:2px 0 0;color:var(--muted)}.ph .sp{flex:1}
.tabbar{display:none}

/* composants */
.carte{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--bord);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.carte h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
svg{width:20px;height:20px;flex:none}
.carte.h1{background:linear-gradient(135deg,#5e0a22,#8f1736 55%,#d65a63);color:#fff;border:0;box-shadow:0 14px 40px rgba(214,69,93,.35)}
.carte.h1 .k{color:#ffffffd0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}.grid>.carte{margin:0}
.k{font-size:12.5px;color:var(--muted)}.v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;min-height:42px;border-radius:10px;border:1px solid var(--bord);background:var(--surface);font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface2)}.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.ko{color:var(--ko)}.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;min-height:42px;padding:8px 11px;border:1px solid var(--bord);border-radius:10px;background:var(--surface)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);font-weight:550}label>input,label>select,label>textarea{margin-top:4px;color:var(--txt);font-weight:400}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .full{grid-column:1/-1}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.ko{background:var(--ko-soft);color:var(--ko)}.badge.acc{background:var(--acc-soft);color:var(--acc)}
.vide{text-align:center;color:var(--muted);padding:26px 10px}.vide b{display:block;font-size:30px;margin-bottom:4px}

/* barre d'ajout rapide */
.ajout{display:flex;gap:8px;flex-wrap:wrap}.ajout input[type=text]{flex:1 1 220px}.ajout select,.ajout input[type=date]{flex:0 1 150px}
.filtres{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:6px 13px;min-height:36px;border:1px solid var(--bord);border-radius:99px;background:var(--surface);cursor:pointer;font-weight:550;font-size:13.5px}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}

/* lignes de tâches / articles */
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:16px 4px 6px;display:flex;gap:8px;align-items:center}
.grp.ko{color:var(--ko)}
.ligne{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--bord);margin-bottom:6px;transition:opacity .25s,transform .25s}
.ligne:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--bord))}
.ligne .tx{flex:1;min-width:0;cursor:pointer}.ligne .t{font-weight:600;overflow-wrap:anywhere}.ligne .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.ligne.fait .t{text-decoration:line-through;color:var(--muted)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--bord-c,#94a3b8);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.ck svg{width:15px;height:15px;opacity:0;color:#fff}.ck:hover svg{opacity:.35;color:var(--acc)}
.ck.on{background:var(--ok);border-color:var(--ok)}.ck.on svg{opacity:1;color:#fff}
.ck.carre{border-radius:8px}
.ib{flex:none;width:36px;height:36px;border-radius:10px;border:0;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}.ib:hover{background:var(--surface2);color:var(--txt)}.ib svg{width:18px;height:18px}
.prix{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.rayon{display:flex;align-items:center;gap:8px}.rayon .e{font-size:17px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}.sugg button{padding:5px 11px;border-radius:99px;border:1px dashed var(--bord);background:none;cursor:pointer;font-size:13px}.sugg button:hover{border-style:solid;border-color:var(--acc);color:var(--acc)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.col-d{position:sticky;top:16px}
.pb summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15px}
.pb summary::-webkit-details-marker{display:none}
.pb summary::after{content:'▾';color:var(--muted);transition:transform .2s}.pb:not([open]) summary::after{transform:rotate(-90deg)}
.pb summary>span:first-child{flex:1}
.pb-g{margin-top:12px}.pb-t{font-size:13px;font-weight:700;margin-bottom:6px}
.sugg button.pris{border-style:solid;border-color:transparent;background:var(--ok-soft);color:var(--ok);cursor:default}
.pb-ed{display:flex;gap:4px;align-items:center;margin-bottom:4px}.pb-ed .nb{flex:none;white-space:nowrap;font-size:12px}.ib:disabled{opacity:.3;cursor:default}.pb-ed input{min-height:36px;padding:6px 10px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:12px;margin:14px 0 4px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center;min-height:40px}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:var(--sh)}
.seg .n{font-size:11.5px;font-weight:700;padding:0 7px;border-radius:99px;background:var(--bord);color:var(--txt)}.seg .n.ko{background:var(--ko);color:#fff}
.recherche{display:flex;gap:8px;margin-top:12px}.recherche input{flex:1}
.fpanel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}.fpanel select{min-height:38px;padding:6px 9px;font-size:13.5px}
.btn-filtres{display:none}
.actifs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:8px 2px 0}.lien{border:0;background:none;color:var(--acc);font-weight:650;cursor:pointer;padding:4px;font-size:13px}
.ligne.retard{box-shadow:inset 3px 0 0 var(--ko)}
.drap{color:var(--ko);font-weight:800;margin-right:2px}
.meta{font-size:12.5px;color:var(--muted)}
.ck.fixe{cursor:default}
.qte{flex:none;min-width:38px;min-height:34px;padding:4px 10px;border-radius:99px;border:1px solid transparent;background:var(--acc-soft);color:var(--acc);font-weight:750;font-size:13.5px;cursor:pointer;white-space:nowrap}
.qte.vide{background:none;border:1px dashed var(--bord);color:var(--muted);font-weight:600;font-size:12.5px}
.ligne.fait .qte{background:var(--surface2);color:var(--muted)}
.ligne.art.fait{background:color-mix(in srgb,var(--surface) 60%,transparent)}
@keyframes flash{0%,60%{background:var(--acc-soft);border-color:var(--acc)}}.ligne.flash{animation:flash 1.4s ease-out}
.progres{display:flex;align-items:center;gap:12px;margin:4px 2px 2px;font-size:13.5px}.progres .barre{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}.progres .barre i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
details.dpanier{margin-top:14px}details.dpanier>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:6px 4px}
details.dpanier>summary::-webkit-details-marker{display:none}details.dpanier>summary::after{content:'▾';margin-left:auto}details.dpanier:not([open])>summary::after{transform:rotate(-90deg)}
.pas{display:flex;align-items:center;gap:8px}.pas button{width:48px;height:48px;border-radius:12px;border:1px solid var(--bord);background:var(--surface2);font-size:22px;font-weight:700;cursor:pointer}.pas input{text-align:center;font-size:18px;font-weight:700}
.recap{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.mois{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tdb{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-bottom:14px}.tdb>.carte{margin:0;min-width:0;overflow:hidden}
.bloc{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}.bloc:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--bord))}
.bloc .tt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.bloc .tt .chev{margin-left:auto;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat .v{font-size:26px;margin:0}.stat .k{display:block}.stat.ko .v,.stat.ko .k{color:var(--ko)}
.imp{margin-top:10px;padding-top:10px;border-top:1px solid var(--bord);font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raccourcis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.racc{min-width:0;text-align:center;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:8px 4px;border-radius:14px;border:1px solid var(--bord);background:color-mix(in srgb,var(--surface) 90%,transparent);font-weight:650;font-size:13px;cursor:pointer;color:var(--txt)}
.racc:hover{border-color:var(--acc);color:var(--acc)}.racc.pri{background:var(--btn);border-color:var(--btn);color:#fff}.racc svg{width:22px;height:22px}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:10.5px;font-weight:800;flex:none;letter-spacing:0}
.av.p0{background:var(--acc);color:#fff}.av.p1{background:var(--surface);color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.av-duo{display:inline-flex;flex:none}.av-duo .av+.av{margin-left:-7px}
.ligne.cmp{padding:8px 10px;gap:10px}.ligne.cmp .t{font-weight:600}
.jl{flex:none;width:62px;font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize}.jl.imp-j{color:var(--ko)}
.carte h2 .sp{flex:1}.carte h2{flex-wrap:wrap}main{min-width:0}.carte h2 .lien{font-size:13px}
.panier{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#5e0a22,#8f1736);color:#fff;box-shadow:0 10px 30px rgba(155,27,60,.4);margin-top:14px}
.panier .sp{flex:1}.panier .btn{background:#fff;color:#5e0a22;border:0}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--bord);text-align:left;vertical-align:middle}th{font-size:12px;color:var(--muted);font-weight:650}td.n,th.n{text-align:right}
.etapes{margin:0;padding-left:20px}.etapes li{margin:4px 0}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:8px;font-size:13.5px}

/* boîtes de dialogue */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--txt);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(43,10,20,.45);backdrop-filter:blur(3px)}
.dlg{padding:20px}.dlg h3{margin:0 0 14px;font-size:18px}.dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.dlg .act .sp{flex:1}
fieldset{border:1px solid var(--bord);border-radius:12px;padding:12px;margin:14px 0 0}legend{font-weight:650;font-size:13.5px;padding:0 6px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--txt);font-size:14px}.toggle input{width:20px;height:20px;accent-color:var(--acc)}

/* notification */
#toast{min-width:min(340px,90vw);position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#2b0a14;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .25s;z-index:50;max-width:92vw}
#toast.on{transform:translateX(-50%) translateY(0)}#toast button{background:none;border:0;color:#ffc9bf;font-weight:700;cursor:pointer;padding:6px}

/* mobile */
.btn-filtres.on{border-color:var(--acc);color:var(--acc)}
@media(max-width:900px){.panier{padding:10px 12px;gap:8px}.panier b{font-size:13.5px}.panier .btn{white-space:nowrap;padding:8px 12px;flex:none}.ib{width:40px;height:40px}.btn.sm{min-height:38px}.ck{width:30px;height:30px}dialog{max-height:90vh;overflow:auto}.dlg{padding:18px 16px}.dlg h3{font-size:17px}.dlg .act .btn{flex:1 1 auto}.pb-ed .ib{width:36px}.imp.mois-c,.lien.pc{display:none!important}.tdb .stat .v{font-size:22px}.tdb{grid-template-columns:minmax(0,1fr);gap:10px}.tdb .carte{padding:14px}.stats{margin-top:6px}.stats .v{font-size:24px}.racc{min-height:58px;font-size:12px}.ligne.art .ck{width:30px;height:30px}.ligne.art{padding:12px}.btn-filtres{display:inline-flex}.fpanel{grid-template-columns:1fr 1fr}.fpanel:not(.ouvert){display:none}.seg button{font-size:13px}}
@media(max-width:1100px){.cols{grid-template-columns:1fr}.col-d{position:static}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}aside{display:none}
 main{padding:18px 14px calc(96px + env(safe-area-inset-bottom))}
 .ph h1{font-size:22px}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--bord)}
 .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;border-radius:10px}
 .tb.on{color:var(--acc)}.tb .pill{position:absolute;top:0;right:calc(50% - 22px);font-size:10px;padding:0 5px;min-width:16px}
 .fg{grid-template-columns:1fr}
 #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
 .panier{bottom:calc(76px + env(safe-area-inset-bottom))}
 .ajout select,.ajout input[type=date]{flex:1 1 40%}
}
@media(prefers-color-scheme:dark){.pill,.av.p0{background:#b02a46;border-color:#b02a46;color:#fff}}.btn:not(.pri):not(.ko){border:1.5px solid var(--bord-c);font-weight:650}.btn.ko{background:transparent;color:var(--ko);border:1.5px solid var(--ko)}.btn.ko:hover{background:var(--ko-soft)}
/* THEME NOIR : fond bordeaux, structure noire */
html:root{color-scheme:dark;--bg:#62011d;--bgbase:#62011d;--surface:#0c0c0d;--surface2:#18181b;--bord:#34343a;--bord-c:#8a8a93;--txt:#fff;--muted:#b8b8c0;--acc:#f6e6c8;--acc2:#e8737a;--acc-soft:#26262b;--acc-s:#f6e6c8;--btn:#f6e6c8;--btn-h:#fff;--ok:#34d399;--ok-soft:#0e2a21;--warn:#fbbf24;--warn-soft:#2b2210;--ko:#ff6b5e;--ko-soft:#3a1214;--inf:#7cc3d6;--inf-soft:#12303a;--grid:rgba(246,230,200,.05);--ia:0;--sh:0 8px 28px rgba(0,0,0,.35)}
html,body{background:radial-gradient(1100px 700px at 85% -10%,#7d0c2c,transparent 60%),#62011d;background-attachment:fixed}
.bg{display:none!important}
aside{background:#050506!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

<script>
'use strict';
/* =====================================================================
   PLAN DU MODULE « QUOTIDIEN » (repères pour la fusion avec Mon budget)
   1. Outils (dates, montants, échappement)      6. Courses + pense-bête
   2. Rayons et rangement automatique            7. Vers « Mon budget » (fichier JSON)
   3. Données : verifierDonnees(), chargement    8. Réglages, sauvegarde, restauration
   4. Navigation, compteurs, notifications       9. Démarrage
   5. Accueil, Tâches
   Données (clé localStorage « quotidien.v1 ») :
   S = { v, personnes[2], categories[], rayons[{k,e,n}], taches[], journal[],
         courses[], catalogue{}, achats[], magasins[], penseBete[], pbOuvert, sauv }
   Noms globaux identiques dans Mon budget (à préfixer lors de la fusion) :
   S, CLE, ONGLETS, STATUTS, aller, esc, fd, iso, nav, norm, onglet, rendu,
   sauver, toast, vide — et les id HTML #nav, #tabbar, #vue.
   ===================================================================== */
/* =====================================================================
   NOTRE QUOTIDIEN — tâches et liste de courses
   Toutes les données restent dans ce navigateur (localStorage).
   Lien avec « Mon budget » : un fichier JSON au format de sauvegarde

const CLE = 'quotidien.v1';

/* ---------- outils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const auj = () => iso(new Date());
const versDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const plusJours = (s, n) => { const d = versDate(s); d.setDate(d.getDate() + n); return iso(d); };
const plusMois = (s, n) => { const d = versDate(s), j = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const fin = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(j, fin)); return iso(d); };
const ecart = s => Math.round((versDate(s) - versDate(auj())) / 864e5);
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fd = s => { if (!s) return ''; const d = versDate(s); return d.getDate() + ' ' + MOIS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const quand = s => { const e = ecart(s); if (e === 0) return "aujourd'hui"; if (e === 1) return 'demain'; if (e === -1) return 'hier'; if (e > 1 && e < 7) return JOURS[versDate(s).getDay()]; if (e < 0) return 'il y a ' + (-e) + ' j'; return fd(s); };
const euros = c => (c / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const versCents = v => { let t = String(v ?? '').replace(/[\s\u00a0€]/g, ''); if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; const n = Number(t); return Number.isFinite(n) ? Math.round(n * 100) : null; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const $ = id => document.getElementById(id);

/* ---------- icônes ---------- */
const IC = {

 course:'<path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h7.7a2 2 0 002-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="18" cy="20.5" r="1.3"/>',
 budget:'<path d="M4 7h16v12H4z"/><path d="M16 13h2M4 7l3-3h10l3 3"/>',
 reglage:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-2.7-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.6 1.6 0 003 15H3a2 2 0 110-4h.1a1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009 3.6V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1.3z"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',

const ico = (n, cl = '') => `<svg class="${cl}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- rayons et rangement automatique des articles ---------- */
const RAYONS = [

 ['frais', '🧀', 'Crèmerie et frais', 'lait beurre creme yaourt yogourt fromage emmental comte camembert mozzarella feta parmesan oeuf oeufs skyr fromage blanc petit suisse jambon lardon lardons knacki saucisse pate feuilletee pate brisee pate a pizza houmous dessert compote'],

 ['surgeles', '❄️', 'Surgelés', 'surgele surgeles glace pizza surgelee frites legumes surgeles poisson pane nuggets'],
 ['boissons', '🧃', 'Boissons', 'eau eau gazeuse jus soda coca biere vin champagne limonade lait vegetal boisson'],
 ['bebe', '👶', 'Bébé', 'couche couches lingette lingettes petit pot petits pots lait de croissance lait infantile liniment biberon tetine serum physiologique'],
 ['hygiene', '🧴', 'Hygiène et beauté', 'shampoing gel douche savon dentifrice brosse a dents deodorant coton mouchoir papier toilette rasoir creme solaire maquillage serviette hygienique tampon protection'],
 ['maison', '🧽', 'Entretien et maison', 'lessive adoucissant liquide vaisselle eponge sac poubelle essuie tout papier alu film alimentaire javel nettoyant pastille lave vaisselle ampoule pile allumette bougie'],
 ['autre', '🛒', 'Autre', '']
];
const rayonsDefaut = () => RAYONS.map(([k, e, n]) => ({ k, e, n }));
/* RAY[clé] -> { e: emoji, n: nom } lu en direct dans les réglages (S.rayons) */
const RAY = new Proxy({}, {
 get: (_, k) => { const l = (typeof S !== 'undefined' && S && S.rayons) || rayonsDefaut(); const r = l.find(x => x.k === k); return r ? { e: r.e, n: r.n } : undefined; },
 has: (_, k) => ((typeof S !== 'undefined' && S && S.rayons) || rayonsDefaut()).some(x => x.k === k)

const DICO = [];
RAYONS.forEach(([k, , , mots]) => { if (!mots) return; const l = mots.split(' '); for (let i = 0; i < l.length; i++) { DICO.push([l[i], k]); if (l[i + 1]) DICO.push([l[i] + ' ' + l[i + 1], k]); } });
DICO.sort((a, b) => b[0].length - a[0].length); // les expressions les plus longues d'abord
function devinerRayon(nom) { const r = devinerRayonBrut(nom); return r in RAY ? r : 'autre'; } // un rayon supprimé des réglages renvoie vers « Autre »
function devinerRayonBrut(nom) {
 const n = norm(nom), c = S.catalogue[n];
 if (c) return c.rayon; // déjà acheté : on garde le rayon appris
 const mots = n.replace(/[^a-z0-9 ]/g, ' ');
 if (/\bbebe\b/.test(mots)) return 'bebe';
 const ph = ' ' + mots + ' ';
 for (const [m, k] of DICO) if (m.length > 2 && (ph.includes(' ' + m + ' ') || ph.includes(' ' + m + 's ') || ph.includes(' ' + m + 'x '))) return k;

}

/* ---------- données ---------- */
const CATS_T = ['Maison', 'Administratif', 'Santé', 'Enfants', 'Voiture', 'Jardin', 'Achats', 'Autre'];
const RECUR = { aucune: 'Une seule fois', jour: 'Chaque jour', semaine: 'Chaque semaine', deuxsem: 'Toutes les 2 semaines', mois: 'Chaque mois' };

const PB_DEFAUT = [

 ['🍽️ Repas de la semaine', ['Fruits', 'Légumes', 'Viande / poisson', 'Pâtes, riz, féculents', 'Œufs', 'Fromage, yaourts', 'Pain', 'Petit-déjeuner (café, thé, céréales)', 'Goûters']],
 ['🧴 Salle de bain', ['Papier toilette', 'Gel douche', 'Shampoing', 'Dentifrice', 'Coton', 'Déodorant']],
 ['🏠 Maison', ['Lessive', 'Liquide vaisselle', 'Pastilles lave-vaisselle', 'Éponges', 'Sacs poubelle', 'Essuie-tout', 'Produit ménager', 'Piles / ampoules']]
];
const pbDefaut = () => PB_DEFAUT.map(([titre, items]) => ({ id: uid(), titre, items: items.slice() }));
const vide = () => ({ v: 1, personnes: ['Robin', 'Maelys'], taches: [], courses: [], catalogue: {}, achats: [], magasins: [], sauv: '', penseBete: pbDefaut(), pbOuvert: true, journal: [], categories: CATS_T.slice(), rayons: rayonsDefaut() });
const ISO = { test: x => typeof x === 'string' && /^\d{4}-\d\d-\d\d$/.test(x) && iso(versDate(x)) === x }; // date AAAA-MM-JJ réellement existante
/* État d'envoi vers Mon budget : à envoyer -> import à confirmer -> importé */
const etatEnvoi = x => x.confirmeLe ? 'importe' : x.fichierLe ? 'a_confirmer' : 'a_envoyer';
const ENVOI = { a_envoyer: ['À envoyer', 'acc'], a_confirmer: ['Import à confirmer', 'warn'], importe: ['Importé', 'ok'] };
/* Courses : transmission automatique vers Mon budget par la boîte d'échange (maison.js). Plus de fichier ni de confirmation. */
const ENVOI_A = { demo: ['Exemple, non envoyé', ''], importe: ['Dans Mon budget', 'ok'], rapproche: ['Rapprochée avec la banque', 'ok'], attente: ['En attente de Mon budget', 'warn'] };
const donneesAchat = a => ({ date: a.date, montantCents: a.montantCents, magasin: a.magasin || '', articles: a.articles.slice(0, 60), categorie: 'Alimentation',
 payeur: { idx: String(a.payePar), nom: a.payePar === 'joint' ? 'Compte commun' : (S.personnes[a.payePar] || '') } });
const MM = () => (window.Maison && window.Maison.echange) ? window.Maison : null;
function emettreAchats() { // dépose (ou met à jour) chaque session de courses avec montant ; sans effet si rien n'a changé
 const M = MM(); if (!M || BLOQUE || !S) return;
 try {
  for (const a of S.achats) if (a.montantCents > 0 && ISO.test(a.date)) M.echange.deposer('depense', a.id, donneesAchat(a));
  for (const t of S.taches) if (projetEnvoyable(t)) M.echange.deposer('projet', t.id, donneesProjet(t));
  // éléments déjà transmis puis supprimés ici (ou projet retiré d'une tâche) : on prévient Mon budget, qui ne supprime jamais rien
  const vivants = new Set([...S.achats.filter(a => a.montantCents > 0).map(a => M.echange.ref('achat', a.id)), ...S.taches.filter(projetEnvoyable).map(t => M.echange.ref('tache', t.id))]);
  for (const [ref, e] of Object.entries(M.echange.entrees())) if (e && e.donnees && !e.donnees.supprime && !vivants.has(ref)) M.echange.deposer(e.type, ref.split(':')[2], { supprime: true });
 } catch (e) {}
}
const donneesProjet = t => ({ nom: t.titre, montantCents: t.projet.montantCents, date: t.projet.date, paiements: t.projet.paiements || 1,
 statut: t.fait ? 'realisee' : t.projet.statut, indispensable: !!t.prio });
const projetEnvoyable = t => t.projet && t.projet.montantCents > 0 && ISO.test(t.projet.date) && !t.projet.demo;
function etatProjet(t) {
 if (t.projet && t.projet.demo) return 'demo';
 const M = MM(); if (!M) return 'attente';
 let k; try { k = M.echange.accuses()[M.echange.ref('tache', t.id)]; } catch (e) {}
 if (!k) return 'attente';
 if (k.rev !== 'legacy' && k.rev !== M.hash(donneesProjet(t))) return 'attente';
 return 'importe';
}
function etatAchat(a) {
 const M = MM(); if (!M) return 'attente';
 let k; try { k = M.echange.accuses()[M.echange.ref('achat', a.id)]; } catch (e) {}
 if (!k) return 'attente';
 if (k.rev !== 'legacy' && k.rev !== M.hash(donneesAchat(a))) return 'attente';
 return k.etat === 'rapproche' ? 'rapproche' : 'importe';
}
function migrerEnvoi(x) { // ancien champ « envoyeLe » (v1-v2) = fichier créé, import jamais confirmé
 if ('envoyeLe' in x) { if (x.envoyeLe && !x.fichierLe) x.fichierLe = x.envoyeLe; delete x.envoyeLe; }
 x.fichierLe = ISO.test(x.fichierLe || '') ? x.fichierLe : ''; x.confirmeLe = ISO.test(x.confirmeLe || '') ? x.confirmeLe : '';
}
/* Vérifie et normalise des données (stockage du navigateur ou fichier de sauvegarde).
   Renvoie { E: erreurs bloquantes, W: avertissements, d: données prêtes } — ne modifie jamais S. */
function verifierDonnees(src) {
 const E = [], W = [], obj = x => x && typeof x === 'object' && !Array.isArray(x), str = x => typeof x === 'string';
 if (!obj(src)) return { E: ["Le contenu n'a pas la structure d'une sauvegarde de Notre quotidien."], W };
 if (src.format === 'budget-sauvegarde-v1') return { E: ["Ce fichier est destiné à « Mon budget » (fichier « vers-budget »), pas à cet outil."], W };
 if (src.format !== undefined && src.format !== 'quotidien-sauvegarde-v1') return { E: ['Format de fichier inconnu : ce n\'est pas une sauvegarde de Notre quotidien.'], W };
 if (Number(src.v) > 1) E.push("Cette sauvegarde vient d'une version plus récente de l'outil : elle ne peut pas être lue ici.");
 if (!Array.isArray(src.taches)) E.push('La liste des tâches est absente ou illisible.');
 if (!Array.isArray(src.courses)) E.push('La liste de courses est absente ou illisible.');
 for (const [k, l] of [['achats', 'dépenses de courses'], ['journal', 'historique des tâches'], ['categories', 'catégories de tâches'], ['rayons', 'rayons'], ['magasins', 'magasins'], ['penseBete', 'pense-bête'], ['personnes', 'prénoms']]) if (src[k] !== undefined && !Array.isArray(src[k])) E.push(`La section « ${l} » est illisible.`);
 if (src.catalogue !== undefined && !obj(src.catalogue)) E.push('La section « articles mémorisés » est illisible.');
 if (E.length) return { E, W };
 const d = JSON.parse(JSON.stringify(src)); delete d.format;
 let nId = 0;
 const ids = () => { const vus = new Set(); return x => { if (!str(x.id) || !x.id || vus.has(x.id)) { x.id = uid(); nId++; } vus.add(x.id); }; };
 // tâches
 const idT = ids(); let badT = 0, badP = 0, datesT = 0;
 d.taches = d.taches.filter(t => { if (!obj(t) || !str(t.titre) || !t.titre.trim()) { badT++; return false; } return true; });
 for (const t of d.taches) {
  idT(t); t.notes = str(t.notes) ? t.notes : '';
  t.qui = t.qui === 'tous' ? 'tous' : (String(t.qui) === '0' || String(t.qui) === '1') ? Number(t.qui) : 'tous';
  if (t.echeance && !ISO.test(t.echeance)) { t.echeance = ''; datesT++; } t.echeance = t.echeance || '';
  t.recur = t.recur in RECUR ? t.recur : 'aucune'; t.cat = str(t.cat) ? t.cat : ''; t.prio = !!t.prio; t.fait = !!t.fait;
  t.faitLe = ISO.test(t.faitLe || '') ? t.faitLe : (t.fait ? auj() : ''); t.creeLe = ISO.test(t.creeLe || '') ? t.creeLe : '';
  if (!(Number.isInteger(t.jourRef) && t.jourRef >= 1 && t.jourRef <= 31)) delete t.jourRef;
  if (t.derniereFois !== undefined && !ISO.test(t.derniereFois)) delete t.derniereFois;
  if (t.projet == null) t.projet = null;
  else if (!obj(t.projet) || !Number.isFinite(t.projet.montantCents) || t.projet.montantCents <= 0 || !ISO.test(t.projet.date || '') || !(t.projet.statut in STATUTS)) badP++;
  else { t.projet.montantCents = Math.round(t.projet.montantCents); t.projet.paiements = Math.max(1, parseInt(t.projet.paiements) || 1); migrerEnvoi(t.projet); }
 }
 // rayons (réglages) : « Autre » est toujours présent
 if (d.rayons === undefined) d.rayons = rayonsDefaut();
 else { const vus = new Set(); d.rayons = d.rayons.filter(r => obj(r) && str(r.k) && r.k && str(r.n) && r.n.trim() && !vus.has(r.k) && vus.add(r.k)).map(r => ({ k: r.k, e: str(r.e) ? r.e.slice(0, 4) : '', n: r.n.trim() })); }
 if (!d.rayons.some(r => r.k === 'autre')) d.rayons.push({ k: 'autre', e: '🛒', n: 'Autre' });
 const RK = new Set(d.rayons.map(r => r.k));
 // catégories de tâches (réglages)
 if (d.categories === undefined) d.categories = CATS_T.slice();
 else { const vus = new Set(); d.categories = d.categories.filter(c => str(c) && c.trim() && !vus.has(norm(c)) && vus.add(norm(c))).map(c => c.trim()); }
 // articles
 const idC = ids(); let badC = 0;
 d.courses = d.courses.filter(c => { if (!obj(c) || !str(c.nom) || !c.nom.trim()) { badC++; return false; } return true; });
 for (const c of d.courses) { idC(c); c.qte = str(c.qte) ? c.qte : ''; c.rayon = RK.has(c.rayon) ? c.rayon : 'autre'; c.prixCents = Number.isFinite(c.prixCents) && c.prixCents > 0 ? Math.round(c.prixCents) : null; c.coche = !!c.coche; }
 // dépenses de courses
 const idA = ids(); let badA = 0;
 d.achats = (d.achats || []).filter(a => { if (!obj(a) || !ISO.test(a.date || '') || !Number.isFinite(a.montantCents) || a.montantCents < 0) { badA++; return false; } return true; });
 for (const a of d.achats) { idA(a); a.magasin = str(a.magasin) ? a.magasin : ''; a.payePar = ['joint', '0', '1'].includes(String(a.payePar)) ? String(a.payePar) : 'joint'; a.detail = Array.isArray(a.detail) ? a.detail.filter(x => obj(x) && str(x.nom) && x.nom).map(x => ({ nom: x.nom, qte: str(x.qte) ? x.qte : '', rayon: str(x.rayon) ? x.rayon : 'autre' })) : []; /* l'historique garde la clé même si le rayon a été supprimé */ a.articles = Array.isArray(a.articles) ? a.articles.filter(str) : []; a.montantCents = Math.round(a.montantCents); migrerEnvoi(a); }

 const M = MM(); if (!M || BLOQUE || !S || $('dlg').open) return false;
 let ac; try { ac = M.echange.accuses(); } catch (e) { return false; }
 let n = 0;
 for (const t of S.taches) {
  if (!t.projet || t.projet.demo) continue;
  const k = ac[M.echange.ref('tache', t.id)], r = k && k.retour; if (!r || r.rev !== M.hash(donneesProjet(t))) continue;
  const p = t.projet; if (!ISO.test(r.date || '') || !(r.montantCents > 0)) continue;
  const pa = r.paiements >= 1 ? r.paiements : p.paiements, st = r.statut in STATUTS ? r.statut : p.statut;
  if (p.date !== r.date || p.montantCents !== r.montantCents || p.paiements !== pa || p.statut !== st) { p.date = r.date; p.montantCents = r.montantCents; p.paiements = pa; p.statut = st; n++; }
 }
 if (n) { sauver(); rendu(); toast(`${n} projet(s) mis à jour d'après la simulation dans Mon budget`); }
 return n > 0;
}
function supprTache(id) {
 const t = S.taches.find(x => x.id === id);
 if (t && t.projet && etatProjet(t) === 'importe' && !confirm(`Le projet de ${euros(t.projet.montantCents)} restera dans Mon budget, qui sera seulement prévenu que la tâche est supprimée. Continuer ?`)) return;
 if (t && estRecurrente(t)) { const n = S.journal.filter(j => j.tacheId === id).length; if (!confirm(`« ${t.titre} » est une tâche récurrente (${RECUR[t.recur].toLowerCase()}).

La supprimer arrête toutes ses prochaines occurrences. ${n ? `L'historique de ses ${n} réalisation(s) est conservé. ` : ''}Les autres tâches ne sont pas touchées.

Astuce : pour seulement arrêter la répétition, choisissez « Une seule fois » dans la fiche.

Supprimer la tâche ?`)) return; }
 const annuler = instantane(); S.taches = S.taches.filter(x => x.id !== id); sauver(); $('dlg').close(); rendu(); toast('Tâche supprimée', annuler);
}

/* =====================================================================
   COURSES
   ===================================================================== */
function datalist() {
 return `<datalist id="dl-art">${Object.values(S.catalogue).sort((a, b) => b.n - a.n).slice(0, 200).map(c => `<option value="${esc(c.nom)}">`).join('')}</datalist>`;
}
const sing = x => norm(x).replace(/[sx]$/, ''); // « Baguette » et « baguettes » sont le même article
const cap = x => x.charAt(0).toUpperCase() + x.slice(1);
function analyserSaisie(brut) {
 // « 2 lait », « lait x2 » ou « 500g farine » : la quantité est extraite
 let qte = '', nom = brut.trim(), m;
 if ((m = nom.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|g|l|cl|ml|x)?)\s+(.+)$/i))) { qte = m[1]; nom = m[2]; }
 else if ((m = nom.match(/^(.+?)\s+[x×]\s*(\d+)$/i))) { nom = m[1]; qte = m[2]; }
 return { nom: cap(nom.trim()), qte: qte.trim() };
}
function flash(id) { const el = $('c-' + id); if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
function ajoutArticle(inputId, nomDirect) {
 const el = inputId ? $(inputId) : null;
 const brut = nomDirect || (el ? el.value.trim() : '');
 if (!brut) { if (el) el.focus(); return; }
 const { nom, qte } = analyserSaisie(brut);
 if (!nom) return;
 // article déjà présent : on le met à jour au lieu de créer un doublon
 const deja = S.courses.find(c => sing(c.nom) === sing(nom));
 if (deja) {
  const annuler = instantane(); let msg;
  if (deja.coche) { deja.coche = false; if (qte) deja.qte = qte; msg = `« ${deja.nom} » était dans le panier : remis dans les articles à acheter`; }
  else if (qte && qte !== deja.qte) { msg = `« ${deja.nom} » est déjà dans la liste : quantité ${deja.qte ? deja.qte + ' → ' : ''}${qte}`; deja.qte = qte; }
  else msg = `« ${deja.nom} » est déjà dans la liste`;
  if (el) el.value = ''; sauver(); rendu(); flash(deja.id);
  const n = inputId && $(inputId); if (n) n.focus();
  if (msg.endsWith('dans la liste')) toast(msg, () => dlgQte(deja.id), 'Quantité'); else toast(msg, annuler);
  return;
 }
 const cat = S.catalogue[norm(nom)];
 const rayon = devinerRayon(nom);
 S.courses.push({ id: uid(), nom: cat ? cat.nom : nom, qte, rayon, prixCents: null, coche: false });
 if (el) el.value = '';
 PREMIERE = false; sauver(); rendu();
 const n = inputId && $(inputId); if (n) n.focus();
 toast(`« ${nom} » ajouté · ${(RAY[rayon] || { n: 'Autre' }).n}`);
}
let panierOuvert = false;
function ligneArt(c) {
 return `<div class="ligne art ${c.coche ? 'fait' : ''}" id="c-${c.id}">
  <button class="ck carre ${c.coche ? 'on' : ''}" onclick="cocherArticle('${c.id}')" aria-label="${c.coche ? 'Remettre dans les articles à acheter' : 'Mettre dans le panier'} : ${esc(c.nom)}">${ico('check')}</button>
  <div class="tx" onclick="cocherArticle('${c.id}')"><div class="t">${esc(c.nom)}</div></div>
  ${c.prixCents ? `<span class="prix">${euros(c.prixCents)}</span>` : ''}
  <button class="qte ${c.qte ? '' : 'vide'}" onclick="dlgQte('${c.id}')" aria-label="Quantité de ${esc(c.nom)} : ${c.qte ? esc(c.qte) : 'non précisée'}">${c.qte ? esc(c.qte) : '+ qté'}</button>
  <button class="ib" onclick="editerArticle('${c.id}')" aria-label="Modifier ${esc(c.nom)}">${ico('crayon')}</button></div>`;
}
function vCourses() {
 const afaire = S.courses.filter(c => !c.coche), panier = S.courses.filter(c => c.coche);
 const parRayon = {}; for (const c of afaire) { const k = c.rayon in RAY ? c.rayon : 'autre'; (parRayon[k] = parRayon[k] || []).push(c); }
 const listes = S.rayons.filter(r => parRayon[r.k]).map(r => `<div class="grp rayon"><span class="e">${esc(r.e)}</span>${esc(r.n)} <span class="badge">${parRayon[r.k].length}</span></div>${parRayon[r.k].map(ligneArt).join('')}`).join('');
 // suggestions : articles souvent achetés qui ne sont pas déjà sur la liste
 const dans = new Set(S.courses.map(c => sing(c.nom)));
 const sugg = Object.values(S.catalogue).filter(c => !dans.has(sing(c.nom))).sort((a, b) => b.n - a.n || (b.last || '').localeCompare(a.last || '')).slice(0, 14);
 const totalPanier = panier.reduce((s, c) => s + (c.prixCents || 0), 0), nt = S.courses.length;

 return `<div class="ph"><div><h1>Liste de courses</h1><p>Rangée par rayon automatiquement. Touchez un article pour le mettre dans le panier.</p></div><div class="sp"></div><button class="btn pri" onclick="terminerCourses()">${ico('check')}Mes courses sont finies</button></div>
 <div class="cols"><div class="col-g">
 <div class="carte">
  <div class="ajout"><input type="text" id="co-a" list="dl-art" placeholder="Ajouter un article (ex. : 2 baguettes) puis Entrée" onkeydown="if(event.key==='Enter')ajoutArticle('co-a')"><button class="btn pri" onclick="ajoutArticle('co-a')">${ico('plus')}Ajouter</button></div>
  ${datalist()}
  ${sugg.length ? `<div class="k" style="margin:12px 0 6px">Souvent achetés — un clic pour ajouter :</div><div class="sugg">${sugg.map(c => `<button onclick="ajoutArticle(null,this.dataset.n)" data-n="${esc(c.nom)}">${RAY[c.rayon] ? RAY[c.rayon].e : ''} ${esc(c.nom)}</button>`).join('')}</div>` : ''}
 </div>
 ${progres}
 ${listes || (panier.length ? '' : '<div class="carte vide"><b>🛒</b>La liste est vide. Ajoutez des articles ci-dessus.</div>')}
 ${panier.length ? `<details class="dpanier" ${panierOuvert ? 'open' : ''} ontoggle="panierOuvert=this.open"><summary>🧺 Dans le panier <span class="badge ok">${panier.length}</span> <span class="k" style="text-transform:none;letter-spacing:0;font-weight:500">— touchez pour décocher</span></summary>${panier.map(ligneArt).join('')}</details>
 <div class="panier"><div><b>${panier.length} article${panier.length > 1 ? 's' : ''} dans le panier</b>${totalPanier ? `<div style="font-size:12.5px;opacity:.85">Prix notés : ${euros(totalPanier)}</div>` : afaire.length ? `<div style="font-size:12.5px;opacity:.85">${afaire.length} restant(s)</div>` : ''}</div><span class="sp"></span><button class="btn" onclick="terminerCourses()">Mes courses sont finies</button></div>` : ''}
 </div><div class="col-d">${vPenseBete()}</div></div>
 ${vHistorique()}`;

function cocherArticle(id) {
 const c = S.courses.find(x => x.id === id); if (!c) return;
 c.coche = !c.coche; sauver();
 const el = $('c-' + id);
 if (el) { el.style.opacity = '0'; el.style.transform = c.coche ? 'translateX(16px)' : 'translateX(-16px)'; setTimeout(rendu, 180); } else rendu();
}
/* Quantité : − / + sur le nombre en tête (« 2 », « 500 g », « 3 x »), ou saisie libre */
function pasQte(v, d) { const m = String(v || '').trim().match(/^(\d+)(.*)$/); if (!m) return d > 0 ? (v ? v : '2') : v; if (/^\s*(k?g|[mc]?l)\b/i.test(m[2])) return v; /* « 500 g » : à modifier au clavier */ const n = Number(m[1]) + d; return n <= 0 ? '' : n === 1 && !m[2].trim() && d < 0 ? '1' : n + m[2]; }

 $('dlg').innerHTML = `<form class="dlg" onsubmit="return enregQte(event,'${id}')"><h3>${esc(c.nom)}</h3>
 <label for="q-v">Quantité</label>
 <div class="pas" style="margin-top:6px"><button type="button" onclick="$('q-v').value=pasQte($('q-v').value,-1)" aria-label="Moins">−</button><input type="text" id="q-v" value="${esc(c.qte || '1')}" placeholder="Ex. : 2, 500 g, 1 paquet"><button type="button" onclick="$('q-v').value=pasQte($('q-v').value||'1',1)" aria-label="Plus">+</button></div>
 <div class="act"><button type="button" class="btn ko" onclick="supprArticle('${id}')">${ico('suppr')}Retirer</button><span class="sp"></span><button type="button" class="btn" onclick="$('dlg').close()">Annuler</button><button class="btn pri">OK</button></div></form>`;
 $('dlg').showModal(); setTimeout(() => $('q-v').select(), 30);
}
function enregQte(ev, id) {
 ev.preventDefault();
 const c = S.courses.find(x => x.id === id); if (!c) { $('dlg').close(); rendu(); return false; }
 const v = $('q-v').value.trim(); c.qte = v === '1' && !c.qte ? '' : v; sauver(); $('dlg').close(); rendu(); return false;
}
function editerArticle(id) {
 const c = S.courses.find(x => x.id === id); if (!c) { rendu(); return; }
 $('dlg').innerHTML = `<form class="dlg" onsubmit="return enregArticle(event,'${id}')"><h3>Modifier l'article</h3>
 <div class="fg"><label class="full">Article<input type="text" id="a-n" required value="${esc(c.nom)}"></label>
 <label>Quantité<input type="text" id="a-q" value="${esc(c.qte)}" placeholder="Ex. : 2, 500 g"></label>

 <label class="full">Rayon<select id="a-r">${S.rayons.map(r => `<option value="${esc(r.k)}" ${c.rayon === r.k ? 'selected' : ''}>${esc(r.e)} ${esc(r.n)}</option>`).join('')}</select></label></div>
 <p class="k">Le rayon choisi sera retenu pour les prochaines fois.</p>
 <p class="k" id="a-err" style="color:var(--ko)"></p>
 <div class="act"><button type="button" class="btn ko" onclick="supprArticle('${id}')">${ico('suppr')}Retirer</button><span class="sp"></span><button type="button" class="btn" onclick="$('dlg').close()">Annuler</button><button class="btn pri">Enregistrer</button></div></form>`;
 $('dlg').showModal();
}
function enregArticle(ev, id) {
 ev.preventDefault();
 const c = S.courses.find(x => x.id === id);
 if (!c) { $('dlg').close(); rendu(); toast("Cet article n'est plus dans la liste."); return false; }
 const px = $('a-p').value.trim() ? versCents($('a-p').value) : null;
 if ($('a-p').value.trim() && (px === null || px <= 0)) { $('a-err').textContent = 'Prix invalide. Exemple : 2,35'; $('a-p').focus(); return false; }
 const nom = cap($('a-n').value.trim()) || c.nom;
 const autre = S.courses.find(x => x.id !== id && sing(x.nom) === sing(nom));

 c.nom = nom; c.qte = $('a-q').value.trim(); c.prixCents = px; c.rayon = $('a-r').value;
 const k = norm(c.nom); if (S.catalogue[k]) S.catalogue[k].rayon = c.rayon; else S.catalogue[k] = { nom: c.nom, rayon: c.rayon, n: 0, last: '' };

function supprArticle(id) { const c = S.courses.find(x => x.id === id); const annuler = instantane(); S.courses = S.courses.filter(x => x.id !== id); sauver(); $('dlg').close(); rendu(); toast(`${c ? '« ' + c.nom + ' » retiré' : 'Article retiré'}`, annuler); }

/* ---------- clôture des courses ----------
   Achetés = articles cochés (ou tous, avec confirmation). Les autres restent dans la liste.
   Une session est créée dès qu'il y a un montant ou des articles achetés. */
function optPayeur(v) { return [['joint', 'Compte commun'], ['0', S.personnes[0]], ['1', S.personnes[1]]].map(([k, n]) => `<option value="${k}" ${String(v) === k ? 'selected' : ''}>${esc(n)}</option>`).join(''); }

 const total = panier.reduce((s, c) => s + (c.prixCents || 0), 0), dernier = S.achats[0] ? S.achats[0].payePar : 'joint';
 const noms = l => l.slice(0, 12).map(c => esc((c.qte ? c.qte + ' ' : '') + c.nom)).join(', ') + (l.length > 12 ? ` et ${l.length - 12} autre(s)` : ''); /* liste courte : la fenêtre reste lisible sur téléphone */
 $('dlg').innerHTML = `<form class="dlg" onsubmit="return validerCourses(event)"><h3>✅ Mes courses sont finies</h3>
 <div class="recap">🧺 <b>${panier.length} article(s) acheté(s)</b>${panier.length ? ' — gardés dans l\'historique' : ' (aucun article coché)'}${reste.length ? `<br>📝 <b>${reste.length} non acheté(s)</b> — restent dans la liste pour la prochaine fois<div class="k" style="margin-top:2px">${noms(reste)}</div>` : ''}</div>
 <div class="fg">
  <label>Montant total payé (€)<input type="text" inputmode="decimal" id="tc-m" value="${total ? (total / 100).toString().replace('.', ',') : ''}" placeholder="Ex. : 87,45"></label>
  <label>Date<input type="date" id="tc-d" value="${auj()}" required></label>
  <label class="full">Magasin<input type="text" id="tc-s" list="dl-mag" placeholder="Ex. : Carrefour, marché…" value="${esc(S.magasins[0] || '')}"></label>
  <datalist id="dl-mag">${S.magasins.map(m => `<option value="${esc(m)}">`).join('')}</datalist>
  <label class="full">Payé par<select id="tc-p">${optPayeur(dernier)}</select></label>
  ${reste.length ? `<label class="toggle full"><input type="checkbox" id="tc-tout" onchange="$('tc-warn').hidden=!this.checked"> J'ai tout acheté (compter aussi les ${reste.length} article(s) non coché(s))</label>
  <p class="note full" id="tc-warn" hidden style="margin:0">Ces ${reste.length} article(s) seront comptés comme achetés et retirés de la liste. Une confirmation vous sera demandée.</p>` : ''}
 </div>
 <p class="k">La dépense sera transmise automatiquement à Mon budget (déjà validée). Sans montant, la session est gardée dans l'historique et le montant pourra être ajouté plus tard.</p>
 <p class="k" id="tc-err" style="color:var(--ko)"></p>
 <div class="act"><button type="button" class="btn" onclick="$('dlg').close()">Annuler</button><button class="btn pri" id="tc-go">Enregistrer</button></div></form>`;
 $('dlg').showModal(); setTimeout(() => $('tc-m').focus(), 30);

function validerCourses(ev) {

 const brut = $('tc-m').value.trim(), m = brut ? versCents(brut) : 0;
 if (brut && (!m || m <= 0)) { $('tc-err').textContent = 'Montant invalide. Exemple : 87,45'; return false; }

 const annuler = instantane(), d = $('tc-d').value, mag = $('tc-s').value.trim(), ids = new Set(achete.map(c => c.id));
 for (const c of achete) { const k = norm(c.nom), x = S.catalogue[k] || { nom: c.nom, rayon: c.rayon, n: 0 }; x.n++; x.last = d; x.rayon = c.rayon; S.catalogue[k] = x; }
 // session de courses : tout ce qu'il faudra pour le rapprochement avec Mon budget
 S.achats.unshift({ id: uid(), date: d, magasin: mag, montantCents: m || 0, payePar: $('tc-p').value,
  articles: achete.map(c => c.nom), detail: achete.map(c => ({ nom: c.nom, qte: c.qte || '', rayon: c.rayon })),

 return false;
}

/* ---------- pense-bête (modifiable) ---------- */

 } else {

/* =====================================================================
   VERS « MON BUDGET » — tout part automatiquement par la boîte d'échange (voir plus haut : emettreAchats, etatAchat, etatProjet).
   Plus aucun fichier à créer, importer ni confirmer.
   ===================================================================== */
async function telecharger(nom, objet) {
 const f = new File([JSON.stringify(objet, null, 1)], nom, { type: 'application/json' });
 try { if (navigator.canShare && navigator.canShare({ files: [f] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { await navigator.share({ files: [f], title: nom }); return true; } } catch (e) { if (e && e.name === 'AbortError') return false; }
 const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return true;
}

function catRenommer(i, v) {

 toast('Sauvegarde restaurée', () => { S = JSON.parse(avant); sauver(); rendu(); });
}
function secoursDispo() { try { return !!(localStorage.getItem(CLE + '.secours') || (BLOQUE && BRUT)); } catch (e) { return BLOQUE; } }
function telechargerSecours() {
 let brut = null; try { brut = localStorage.getItem(CLE + '.secours'); } catch (e) {}
 brut = brut || BRUT; if (!brut) return;
 const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([brut], { type: 'application/json' })); a.download = 'copie-secours-quotidien-' + auj() + '.json'; document.body.appendChild(a); a.click(); a.remove();
 if (BLOQUE) { BLOQUE = false; sauver(); rendu(); toast('Copie téléchargée : l\'enregistrement est de nouveau actif.'); }
}
function oublierCatalogue() { if (!confirm('Oublier tous les articles mémorisés (suggestions et rayons appris) ?')) return; const annuler = instantane(); S.catalogue = {}; sauver(); rendu(); toast('Articles oubliés', annuler); }
function toutEffacer() {
 const nb = 0;
 $('dlg').innerHTML = `<div class="dlg"><h3>🗑️ Tout effacer</h3>
 <p>Toutes les tâches, la liste de courses, les articles mémorisés, l'historique des dépenses et le pense-bête personnalisé seront effacés. Seuls les prénoms sont conservés.</p>
 ${nb ? `<p class="note">${nb} élément(s) n'ont pas encore été confirmés comme importés dans Mon budget.</p>` : ''}
 <p class="k">Pour confirmer, tapez <b>EFFACER</b> ci-dessous.</p>
 <input type="text" id="ef-t" autocomplete="off" oninput="$('ef-go').disabled=this.value.trim().toUpperCase()!=='EFFACER'">
 <div class="act"><button class="btn" onclick="exporterTout()">${ico('dl')}Sauvegarder d'abord</button><span class="sp"></span><button class="btn" onclick="$('dlg').close()">Annuler</button><button class="btn pri" id="ef-go" disabled style="background:var(--ko);border-color:var(--ko)" onclick="effacerConfirme()">Tout effacer</button></div></div>`;
 $('dlg').showModal(); setTimeout(() => $('ef-t').focus(), 30);
}
function effacerConfirme() { if ($('ef-t').value.trim().toUpperCase() !== 'EFFACER') return; copieSecours('avant-effacement'); const annuler = instantane(); const p = S.personnes; S = vide(); S.personnes = p; sauver(); $('dlg').close(); rendu(); toast('Toutes les données ont été effacées', annuler); }

/* ---------- exemple pour découvrir ---------- */
function exemple() {
 const j = auj(), t = (titre, qui, ech, o = {}) => ({ id: uid(), titre, notes: '', qui, echeance: ech, recur: 'aucune', cat: '', prio: false, fait: false, faitLe: '', creeLe: j, projet: null, ...o });
 S.taches.push(
  t('Sortir les poubelles', 'tous', j, { recur: 'semaine', cat: 'Maison' }),
  t('Payer la cantine', 0, plusJours(j, -1), { cat: 'Administratif', prio: true }),
  t('Prendre rendez-vous chez le dentiste', 1, plusJours(j, 3), { cat: 'Santé' }),
  t('Faire la révision de la voiture', 0, plusJours(j, 12), { cat: 'Voiture', projet: { montantCents: 18000, date: plusJours(j, 12), paiements: 1, statut: 'planifiee', fichierLe: '', confirmeLe: '', demo: true } }),
  t('Remplacer le lave-vaisselle', 'tous', '', { cat: 'Maison', projet: { montantCents: 45000, date: plusMois(j, 2), paiements: 3, statut: 'a_planifier', fichierLe: '', confirmeLe: '', demo: true } }),
  t('Arroser les plantes', 1, plusJours(j, 1), { recur: 'deuxsem', cat: 'Maison' })
 );
 ['Lait', 'Baguette', '6 oeufs', 'Tomates', 'Pâtes', 'Liquide vaisselle', 'Yaourts', 'Pommes'].forEach(n => ajoutArticleSilencieux(n));
 for (const [n, r] of [['Café', 'epicerie'], ['Beurre', 'frais'], ['Papier toilette', 'hygiene'], ['Bananes', 'fruits']]) S.catalogue[norm(n)] = { nom: n, rayon: r, n: 3, last: j };
 PREMIERE = false; sauver(); rendu(); toast('Exemple chargé');
}
function ajoutArticleSilencieux(brut) { let qte = '', nom = brut, m; if ((m = brut.match(/^(\d+)\s+(.+)$/))) { qte = m[1]; nom = m[2]; } nom = nom.charAt(0).toUpperCase() + nom.slice(1); S.courses.push({ id: uid(), nom, qte, rayon: devinerRayon(nom), prixCents: null, coche: false }); }

/* fermer la boîte de dialogue en cliquant à côté */
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
/* synchroniser si l'outil est ouvert dans deux onglets */
/* synchroniser si l'outil est ouvert dans deux onglets : seules des données valides sont reprises */
window.addEventListener('storage', e => {
 if (e.key !== CLE || !e.newValue) return;
 let x; try { x = JSON.parse(e.newValue); } catch (err) { return; }
 const R = verifierDonnees(x); if (R.E.length) return;
 S = R.d;
 if ($('dlg').open) { $('dlg').close(); toast('Données modifiées dans un autre onglet : la fenêtre a été fermée pour éviter un écrasement.'); }
 rendu();
});
/* les compteurs dépendent de la date : on rafraîchit après minuit ou au retour sur l'onglet */
let jourAffiche = auj();
function verifierJour() { if (auj() === jourAffiche || $('dlg').open || (document.activeElement && document.activeElement.matches('input,textarea,select'))) return; jourAffiche = auj(); rendu(); }
setInterval(verifierJour, 60000);
/* envoi initial des courses, puis mise à jour de l'état quand Mon budget accuse réception */
const rafraichirEchanges = () => { if ($('dlg').open || (document.activeElement && document.activeElement.matches('input,textarea,select'))) return; if (adopterRetours()) return; if (['accueil', 'taches', 'courses'].includes(onglet)) rendu(); };
document.addEventListener('DOMContentLoaded', () => { emettreAchats(); rafraichirEchanges(); });
addEventListener('storage', e => { if (e.key === 'maison.accuses.v1') rafraichirEchanges(); });
addEventListener('focus', rafraichirEchanges);
document.addEventListener('visibilitychange', () => { if (!document.hidden) verifierJour(); });
rendu();
if (ALERTE) dlgMessage('⚠️ ' + ALERTE.titre, `<p>${esc(ALERTE.texte)}</p>${ALERTE.brut ? `<p><button class="btn pri" onclick="telechargerSecours()">${ico('dl')}Télécharger les données illisibles</button></p>` : ''}`);
</script>
</body>
